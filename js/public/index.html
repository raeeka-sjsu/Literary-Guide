<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #faf6ed;
      --paper-edge: #ede4d0;
      --ink: #2c2620;
      --ink-soft: #6b5b4e;
      --accent: #8b4513;
      --shadow: 0 1px 3px rgba(60, 40, 20, 0.08), 0 8px 24px rgba(60, 40, 20, 0.08);
    }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(180deg, #f3ebd9 0%, #e8dcc0 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ===== Header ===== */
    header.app-header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    header.app-header h1 {
      font-family: "Crimson Pro", Georgia, serif;
      font-weight: 600;
      font-size: 1.6rem;
    }
    header.app-header .subtitle { color: var(--ink-soft); font-size: 0.9rem; }
    header.app-header .back {
      background: none; border: 1px solid var(--paper-edge); padding: 0.4rem 0.9rem;
      border-radius: 4px; cursor: pointer; font-family: inherit; color: var(--ink-soft);
    }
    header.app-header .back:hover { background: var(--paper); }

    /* ===== Library view ===== */
    .library {
      max-width: 1280px; margin: 0 auto; padding: 2rem;
    }
    .library-controls {
      display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 260px;
      padding: 0.7rem 1rem; border: 1px solid var(--paper-edge);
      border-radius: 6px; font-family: inherit; font-size: 1rem;
      background: var(--paper);
    }
    .genre-filter {
      padding: 0.7rem 1rem; border: 1px solid var(--paper-edge);
      border-radius: 6px; font-family: inherit; font-size: 1rem; background: var(--paper);
    }
    .library-stats { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 1rem; }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .book-card {
      background: var(--paper);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow);
      position: relative;
    }
    .book-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(60,40,20,0.12), 0 16px 32px rgba(60,40,20,0.12); }
    .book-spine {
      height: 220px;
      background: linear-gradient(135deg, var(--accent) 0%, #6b3410 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 1rem; text-align: center; color: #fbf3e2;
      position: relative;
    }
    .book-spine::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 0; width: 6px;
      background: linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0));
    }
    .book-spine h3 {
      font-family: "Crimson Pro", Georgia, serif;
      font-size: 1.1rem; line-height: 1.2; font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .book-spine .author { font-size: 0.85rem; opacity: 0.85; }
    .book-spine .year { position: absolute; bottom: 0.5rem; font-size: 0.7rem; opacity: 0.6; }
    .book-card-meta {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--paper-edge);
      font-size: 0.85rem; color: var(--ink-soft);
    }
    .book-card-meta .chapters { font-weight: 500; color: var(--ink); }
    .book-card-meta .genres { font-size: 0.75rem; margin-top: 0.25rem; }
    .badge {
      display: inline-block; background: var(--paper-edge); color: var(--ink-soft);
      padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.7rem;
      margin-right: 0.25rem; margin-top: 0.25rem;
    }

    /* Vary spine colors by hash so the shelf feels diverse */
    .book-spine.c0 { background: linear-gradient(135deg, #8b4513, #6b3410); }
    .book-spine.c1 { background: linear-gradient(135deg, #2c5530, #1f3d22); }
    .book-spine.c2 { background: linear-gradient(135deg, #4a3e6b, #2f2746); }
    .book-spine.c3 { background: linear-gradient(135deg, #7a3a3a, #5a2828); }
    .book-spine.c4 { background: linear-gradient(135deg, #1f3a52, #14283b); }
    .book-spine.c5 { background: linear-gradient(135deg, #6b5326, #4d3a16); }
    .book-spine.c6 { background: linear-gradient(135deg, #5a2c4a, #3e1d33); }
    .book-spine.c7 { background: linear-gradient(135deg, #2e5f5a, #1d423e); }

    /* ===== Reader view ===== */
    .reader {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 1.5rem;
      height: calc(100vh - 90px);
      padding: 1.5rem 2rem;
      max-width: 1500px; margin: 0 auto;
    }
    @media (max-width: 1000px) {
      .reader { grid-template-columns: 1fr; height: auto; }
    }

    /* Book pane (left) */
    .book-pane {
      background: var(--paper);
      border-radius: 4px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .book-toolbar {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--paper-edge);
      display: flex; align-items: center; gap: 0.75rem;
      background: rgba(255,255,255,0.4);
    }
    .book-toolbar select, .book-toolbar input {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--paper-edge); border-radius: 4px;
      background: white; font-family: inherit; font-size: 0.9rem;
    }
    .book-toolbar input.search { flex: 1; min-width: 100px; }
    .book-toolbar button {
      padding: 0.4rem 0.75rem; border: 1px solid var(--paper-edge);
      background: white; border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    .book-toolbar button:hover:not(:disabled) { background: var(--paper-edge); }
    .book-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .book-title-bar {
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid var(--paper-edge);
      font-family: "Crimson Pro", Georgia, serif;
      font-size: 0.95rem; color: var(--ink-soft);
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-content {
      flex: 1; overflow-y: auto;
      padding: 2rem 3rem;
      font-family: "Crimson Pro", Georgia, serif;
      font-size: 1.05rem; line-height: 1.75;
      color: var(--ink);
      position: relative; /* anchor for prompt-menu absolute positioning */
    }
    .page-content h2 {
      font-size: 1.5rem; margin-bottom: 1.5rem;
      text-align: center; font-weight: 600;
    }
    .page-content p { margin-bottom: 1rem; }
    /* Hover-highlight: each paragraph lights up gently when hovered. Click → prompt menu. */
    .page-content p {
      transition: background-color 0.15s ease;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .page-content p:hover {
      background-color: rgba(139, 69, 19, 0.08);
    }
    .page-content p.selected {
      background-color: rgba(139, 69, 19, 0.16);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .prompt-menu {
      position: absolute;
      background: white;
      border: 1px solid var(--paper-edge);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(60, 40, 20, 0.18);
      padding: 0.4rem;
      z-index: 50;
      display: flex; flex-direction: column; gap: 0.2rem;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.85rem;
      min-width: 220px;
    }
    .prompt-menu button {
      background: none; border: none; padding: 0.5rem 0.7rem;
      border-radius: 4px; text-align: left; cursor: pointer;
      font-family: inherit; font-size: 0.85rem; color: var(--ink);
    }
    .prompt-menu button:hover { background: var(--paper); }
    .prompt-menu .menu-divider { height: 1px; background: var(--paper-edge); margin: 0.2rem 0; }
    .prompt-menu .menu-cancel { color: var(--ink-soft); font-size: 0.78rem; }
    .page-content mark {
      background: #fff2a8; padding: 0 0.1em; border-radius: 2px;
    }

    /* Chat pane (right) */
    .chat-pane {
      background: white;
      border-radius: 4px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--paper-edge);
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .chat-header-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-header h3 {
      font-family: "Crimson Pro", Georgia, serif; font-weight: 600; font-size: 1.05rem;
    }
    .chat-header .boundary {
      font-size: 0.75rem; color: var(--ink-soft);
      background: var(--paper); padding: 0.2rem 0.5rem; border-radius: 3px;
    }
    .memory-panel {
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      font-size: 0.82rem;
      color: var(--ink);
      max-height: 140px; overflow-y: auto;
      white-space: pre-wrap;
    }
    .memory-panel .memory-head {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; color: var(--ink-soft); font-size: 0.78rem; margin-bottom: 0.3rem;
    }
    .memory-panel button {
      background: none; border: 1px solid var(--paper-edge);
      padding: 0.15rem 0.5rem; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 0.75rem; color: var(--ink-soft);
    }
    .memory-panel button:hover { background: white; }
    .memory-empty { color: var(--ink-soft); font-style: italic; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 1rem 1.25rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .chat-msg {
      padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.92rem;
      max-width: 90%;
    }
    .chat-msg.user {
      background: var(--accent); color: white; align-self: flex-end;
    }
    .chat-msg.bot {
      background: var(--paper); color: var(--ink); align-self: flex-start;
      white-space: pre-wrap;
    }
    .chat-msg.bot.system {
      background: transparent; color: var(--ink-soft); font-size: 0.85rem; font-style: italic;
      align-self: center; max-width: 100%; text-align: center;
    }
    .chat-msg .citations {
      margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--paper-edge);
      font-size: 0.78rem; color: var(--ink-soft);
    }
    .chat-msg .citations details { cursor: pointer; }
    .chat-msg .citations summary { user-select: none; }
    .chat-msg .citations .cit { margin-top: 0.4rem; padding: 0.4rem 0.6rem; background: white; border-left: 3px solid var(--accent); border-radius: 3px; font-style: normal; }

    /* Agent plan strip */
    .agent-plan { background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 6px; padding: 0.6rem 0.8rem; margin: 0.6rem 0; font-size: 0.82rem; color: var(--ink); }
    .agent-plan .head { font-weight: 600; color: var(--ink-soft); margin-bottom: 0.3rem; font-size: 0.78rem; }
    .agent-step { display: flex; gap: 0.5rem; padding: 0.25rem 0; align-items: center; }
    .agent-step .icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
    .agent-step.running .icon { animation: spin 1s linear infinite; color: var(--accent); }
    .agent-step.done .icon { color: #2c7a2c; }
    .agent-step.fail .icon { color: #c0392b; }
    .agent-step .label { flex: 1; }
    .agent-step .meta { color: var(--ink-soft); font-size: 0.75rem; }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    .agent-step.retried .label::after { content: " (retry)"; color: #b87a30; font-style: italic; }
    .verdict-pass { color: #2c7a2c; font-weight: 600; }
    .verdict-fail { color: #c0392b; font-weight: 600; }

    .chat-input-row {
      padding: 0.75rem 1rem; border-top: 1px solid var(--paper-edge);
      display: flex; gap: 0.5rem;
    }
    .chat-input-row textarea {
      flex: 1; resize: none; padding: 0.6rem; border: 1px solid var(--paper-edge);
      border-radius: 4px; font-family: inherit; font-size: 0.95rem;
      min-height: 38px; max-height: 100px;
    }
    .chat-input-row select {
      padding: 0.4rem; border: 1px solid var(--paper-edge); border-radius: 4px;
      background: white; font-family: inherit; font-size: 0.85rem;
    }
    .chat-input-row button {
      padding: 0.5rem 1rem; background: var(--accent); color: white;
      border: none; border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    .chat-input-row button:hover { background: #6b3410; }
    .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-input-row .row-meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; font-size: 0.8rem; color: var(--ink-soft); }

    .loading { text-align: center; padding: 3rem; color: var(--ink-soft); }
    .error { color: #c0392b; padding: 1rem; background: #fdf2f0; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Literary Guide</h1>
    <span class="subtitle">Spoiler-aware reading companion</span>
    <div style="margin-left:auto;">
      <button id="back-btn" class="back" style="display:none;" onclick="showLibrary()">← Library</button>
    </div>
  </header>

  <!-- ===== Library view ===== -->
  <main id="library-view" class="library">
    <div class="library-controls">
      <input id="search" class="search-box" type="search" placeholder="Search by title or author…" oninput="renderLibrary()" />
      <select id="genre-filter" class="genre-filter" onchange="renderLibrary()">
        <option value="">All genres</option>
      </select>
    </div>
    <div id="library-stats" class="library-stats"></div>
    <div id="book-grid" class="book-grid">
      <p class="loading">Loading library…</p>
    </div>
  </main>

  <!-- ===== Reader view ===== -->
  <main id="reader-view" class="reader" style="display:none;">
    <section class="book-pane">
      <div class="book-title-bar">
        <span id="reader-title"></span>
        <span id="reader-author"></span>
      </div>
      <div class="book-toolbar">
        <button id="prev-ch" onclick="goChapter(-1)">‹ Prev</button>
        <select id="ch-select" onchange="jumpChapter()"></select>
        <button id="next-ch" onclick="goChapter(1)">Next ›</button>
        <input id="page-search" class="search" type="search" placeholder="Search this chapter…" oninput="searchInChapter()" />
      </div>
      <div id="page-content" class="page-content"></div>
    </section>

    <aside class="chat-pane">
      <div class="chat-header">
        <div class="chat-header-row">
          <h3>Discussion</h3>
          <span class="boundary" id="boundary-label">Spoiler boundary: chapter 1</span>
        </div>
        <div class="memory-panel" id="memory-panel" style="display:none;">
          <div class="memory-head">
            <span>📓 Reader memory</span>
            <button onclick="refreshMemory()">Update</button>
          </div>
          <div id="memory-body" class="memory-empty">No memory yet — keep chatting and click Update.</div>
        </div>
      </div>
      <div id="chat-messages" class="chat-messages">
        <div class="chat-msg bot system">Ask about themes, symbolism, or character motives. Answers cite only passages up to your current chapter.</div>
      </div>
      <form class="chat-input-row" onsubmit="sendChat(event)" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; gap:0.5rem;">
          <textarea id="chat-input" required placeholder="What does this chapter reveal about…?"></textarea>
          <button type="submit" id="chat-send">Ask</button>
        </div>
        <div class="row-meta">
          <label>LLM:</label>
          <select id="chat-provider">
            <option value="ollama">Ollama (local, free)</option>
            <option value="dry-run">dry-run (retrieval only)</option>
            <option value="anthropic">Anthropic Claude</option>
            <option value="openai">OpenAI</option>
          </select>
          <label style="margin-left: 0.75rem;">
            <input type="checkbox" id="agent-mode-toggle" />
            agent mode (Planner→Executor→Critic)
          </label>
        </div>
      </form>
    </aside>
  </main>

  <script>
    // ==== State ====
    let CATALOG = [];
    let CURRENT_BOOK = null;     // full book object {chapters: [...]}
    let CURRENT_CH = 0;          // 0-indexed

    // ==== Library ====
    async function loadLibrary() {
      try {
        const res = await fetch("/api/books");
        if (!res.ok) throw new Error("Failed to load catalog");
        CATALOG = await res.json();
        // Populate genre filter
        const allGenres = new Set();
        CATALOG.forEach(b => (b.genres || []).forEach(g => allGenres.add(g)));
        const sel = document.getElementById("genre-filter");
        [...allGenres].sort().forEach(g => {
          const opt = document.createElement("option");
          opt.value = g; opt.textContent = g;
          sel.appendChild(opt);
        });
        renderLibrary();
      } catch (e) {
        document.getElementById("book-grid").innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    function renderLibrary() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const genre = document.getElementById("genre-filter").value;
      const filtered = CATALOG.filter(b => {
        if (genre && !(b.genres || []).includes(genre)) return false;
        if (!q) return true;
        return (
          b.title.toLowerCase().includes(q) ||
          b.author.toLowerCase().includes(q) ||
          (b.genres || []).some(g => g.toLowerCase().includes(q))
        );
      });
      document.getElementById("library-stats").textContent =
        `${filtered.length} of ${CATALOG.length} books`;
      const grid = document.getElementById("book-grid");
      if (!filtered.length) {
        grid.innerHTML = '<p class="loading">No books match.</p>';
        return;
      }
      grid.innerHTML = filtered.map(b => {
        const colorClass = "c" + (Math.abs(hash(b.id)) % 8);
        const genres = (b.genres || []).slice(0, 3).map(g => `<span class="badge">${g}</span>`).join("");
        return `
          <div class="book-card" onclick="openBook('${b.id}')">
            <div class="book-spine ${colorClass}">
              <h3>${escapeHtml(b.title)}</h3>
              <div class="author">${escapeHtml(b.author)}</div>
              <div class="year">${b.year || ""}</div>
            </div>
            <div class="book-card-meta">
              <div class="chapters">${b.chapter_count} ${b.chapter_count === 1 ? "chapter" : "chapters"}</div>
              <div class="genres">${genres}</div>
            </div>
          </div>`;
      }).join("");
    }

    function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ==== Reader ====
    async function openBook(bookId) {
      try {
        const res = await fetch(`/api/books/${bookId}`);
        if (!res.ok) throw new Error("Could not load book");
        CURRENT_BOOK = await res.json();
        CURRENT_CH = 0;

        // Pull persisted memory + reading position
        let memData = null;
        try {
          const memRes = await fetch(`/api/memory/${bookId}`);
          if (memRes.ok) memData = await memRes.json();
        } catch (_) {}

        document.getElementById("library-view").style.display = "none";
        document.getElementById("reader-view").style.display = "grid";
        document.getElementById("back-btn").style.display = "inline-block";
        document.getElementById("reader-title").textContent = CURRENT_BOOK.title;
        document.getElementById("reader-author").textContent = CURRENT_BOOK.author;

        // Populate chapter select
        const sel = document.getElementById("ch-select");
        sel.innerHTML = CURRENT_BOOK.chapters.map((c, i) =>
          `<option value="${i}">${escapeHtml(c.title || `Chapter ${c.number}`)}</option>`
        ).join("");

        // Restore reading position if we have one
        const restoredCh = (memData && memData.reading_position) ? memData.reading_position : null;
        if (restoredCh) {
          // Reading position is the chapter NUMBER. Find matching chapter index.
          const idx = CURRENT_BOOK.chapters.findIndex(c => (c.number || 0) === restoredCh);
          if (idx >= 0) CURRENT_CH = idx;
        }

        // Reset chat: replay recent turns + indexing-status notice
        const chatList = document.getElementById("chat-messages");
        chatList.innerHTML = "";
        if (memData && memData.recent_turns && memData.recent_turns.length) {
          memData.recent_turns.slice(0, 8).reverse().forEach(t => {
            const u = document.createElement("div");
            u.className = "chat-msg user";
            u.textContent = t.question;
            chatList.appendChild(u);
            const b = document.createElement("div");
            b.className = "chat-msg bot";
            b.textContent = t.answer || "(no answer)";
            chatList.appendChild(b);
          });
          const note = document.createElement("div");
          note.className = "chat-msg bot system";
          note.innerHTML = `Welcome back — restored ${memData.recent_turns.length} prior turns${restoredCh ? ` and chapter ${restoredCh}` : ""}.`;
          chatList.appendChild(note);
        }
        const indexNote = document.createElement("div");
        indexNote.className = "chat-msg bot system";
        indexNote.id = "indexing-status";
        indexNote.innerHTML = `Indexing <em>${escapeHtml(CURRENT_BOOK.title)}</em> for chapter-aware Q&amp;A…`;
        chatList.appendChild(indexNote);

        // Memory panel
        const memPanel = document.getElementById("memory-panel");
        const memBody = document.getElementById("memory-body");
        memPanel.style.display = "block";
        if (memData && memData.memory && memData.memory.summary) {
          memBody.classList.remove("memory-empty");
          memBody.textContent = memData.memory.summary;
        } else {
          memBody.classList.add("memory-empty");
          memBody.textContent = "No memory yet — keep chatting and click Update.";
        }

        renderChapter();

        // Build per-book RAG index in background
        try {
          const idxRes = await fetch("/api/index_book", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ book_id: bookId }),
          });
          const idxData = await idxRes.json();
          const status = document.getElementById("indexing-status");
          if (status) {
            if (idxRes.ok) {
              status.innerHTML = `Ready — ${idxData.chunks} passages indexed${idxData.cached ? " (cached)" : ""}. Click any paragraph for a quick prompt, or ask anything below.`;
            } else {
              status.innerHTML = `Indexing failed: ${escapeHtml(idxData.error || "unknown")}. Chat may not return relevant passages.`;
            }
          }
        } catch (e) {
          const status = document.getElementById("indexing-status");
          if (status) status.textContent = "Could not reach agent — start it with: python scripts/api_server.py";
        }
      } catch (e) {
        alert(e.message);
      }
    }

    function showLibrary() {
      document.getElementById("library-view").style.display = "block";
      document.getElementById("reader-view").style.display = "none";
      document.getElementById("back-btn").style.display = "none";
      CURRENT_BOOK = null;
    }

    async function refreshMemory() {
      if (!CURRENT_BOOK) return;
      const memBody = document.getElementById("memory-body");
      memBody.textContent = "Summarizing recent discussions…";
      memBody.classList.remove("memory-empty");
      try {
        const provider = document.getElementById("chat-provider").value;
        const r = await fetch(`/api/memory/${CURRENT_BOOK.id}/summarize`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Failed to summarize");
        memBody.textContent = data.summary || "(empty)";
      } catch (e) {
        memBody.textContent = "Couldn't update memory: " + e.message;
      }
    }

    async function persistReadingPosition() {
      if (!CURRENT_BOOK) return;
      const ch = CURRENT_BOOK.chapters[CURRENT_CH];
      const chapterNum = ch.number || (CURRENT_CH + 1);
      try {
        await fetch("/api/reading_position", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ book_id: CURRENT_BOOK.id, chapter: chapterNum }),
        });
      } catch (_) { /* non-blocking */ }
    }

    function renderChapter() {
      const ch = CURRENT_BOOK.chapters[CURRENT_CH];
      const paragraphs = ch.text.split(/\n\s*\n/).filter(p => p.trim());
      const pc = document.getElementById("page-content");
      pc.innerHTML =
        `<h2>${escapeHtml(ch.title || `Chapter ${ch.number}`)}</h2>` +
        paragraphs.map(p => `<p>${escapeHtml(p.trim())}</p>`).join("");
      document.getElementById("ch-select").value = CURRENT_CH;
      document.getElementById("prev-ch").disabled = CURRENT_CH === 0;
      document.getElementById("next-ch").disabled = CURRENT_CH === CURRENT_BOOK.chapters.length - 1;
      document.getElementById("page-search").value = "";

      // Wire click-to-ask on each paragraph
      pc.querySelectorAll("p").forEach((p) => {
        p.addEventListener("click", (e) => {
          e.stopPropagation();
          showPromptMenu(p);
        });
      });

      // Update spoiler boundary in chat
      const chapterNum = ch.number || (CURRENT_CH + 1);
      document.getElementById("boundary-label").textContent = `Spoiler boundary: chapter ${chapterNum}`;
      // Scroll page to top
      pc.scrollTop = 0;

      // Persist reading position so it's restored next session
      persistReadingPosition();
    }

    let _activeMenu = null;
    function showPromptMenu(paragraphEl) {
      // Dismiss any existing menu
      if (_activeMenu) { _activeMenu.remove(); _activeMenu = null; }
      document.querySelectorAll(".page-content p.selected").forEach(p => p.classList.remove("selected"));
      paragraphEl.classList.add("selected");

      const text = paragraphEl.textContent.trim();
      const snippet = text.length > 80 ? text.slice(0, 77) + "…" : text;

      const menu = document.createElement("div");
      menu.className = "prompt-menu";
      const items = [
        { label: "Explain this passage",         q: `Explain this passage in the context of the chapter so far: "${snippet}"` },
        { label: "What is the symbolism here?",  q: `What symbolism appears in this passage and what does it suggest? Passage: "${snippet}"` },
        { label: "Analyze the characters here",  q: `What does this passage reveal about the characters' motives or emotional state? Passage: "${snippet}"` },
        { label: "Generate discussion questions", q: `Generate 3 thoughtful discussion questions about this passage that don't require knowing the rest of the book: "${snippet}"` },
      ];
      items.forEach((it) => {
        const b = document.createElement("button");
        b.textContent = it.label;
        b.onclick = (ev) => {
          ev.stopPropagation();
          dismissMenu();
          document.getElementById("chat-input").value = it.q;
          document.getElementById("chat-input").focus();
        };
        menu.appendChild(b);
      });
      const div = document.createElement("div");
      div.className = "menu-divider";
      menu.appendChild(div);
      const cancel = document.createElement("button");
      cancel.className = "menu-cancel";
      cancel.textContent = "Cancel";
      cancel.onclick = (ev) => { ev.stopPropagation(); dismissMenu(); };
      menu.appendChild(cancel);

      // Position menu just below the paragraph, using offsets relative to .page-content
      const pc = document.getElementById("page-content");
      pc.appendChild(menu);
      const left = Math.min(paragraphEl.offsetLeft + 16, pc.clientWidth - menu.offsetWidth - 16);
      const top = paragraphEl.offsetTop + paragraphEl.offsetHeight + 4;
      menu.style.left = Math.max(8, left) + "px";
      menu.style.top = top + "px";
      _activeMenu = menu;
    }
    function dismissMenu() {
      if (_activeMenu) _activeMenu.remove();
      _activeMenu = null;
      document.querySelectorAll(".page-content p.selected").forEach(p => p.classList.remove("selected"));
    }
    document.addEventListener("click", (e) => {
      if (_activeMenu && !_activeMenu.contains(e.target)) dismissMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && _activeMenu) dismissMenu();
    });

    function goChapter(delta) {
      const next = CURRENT_CH + delta;
      if (next < 0 || next >= CURRENT_BOOK.chapters.length) return;
      CURRENT_CH = next;
      renderChapter();
    }
    function jumpChapter() {
      CURRENT_CH = parseInt(document.getElementById("ch-select").value, 10);
      renderChapter();
    }

    function searchInChapter() {
      const q = document.getElementById("page-search").value.trim();
      const pc = document.getElementById("page-content");
      // Always clear previous highlights first
      pc.querySelectorAll("p").forEach(p => {
        p.innerHTML = escapeHtml(p.textContent);
      });
      if (!q) return;
      // Require at least 2 chars so single letters don't paint everything
      if (q.length < 2) return;
      const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(`(${escaped})`, "gi");
      let firstMark = null;
      pc.querySelectorAll("p").forEach(p => {
        const original = p.textContent;
        if (original.match(re)) {
          p.innerHTML = escapeHtml(original).replace(re, "<mark>$1</mark>");
          if (!firstMark) firstMark = p.querySelector("mark");
        }
      });
      if (firstMark) firstMark.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (!CURRENT_BOOK) return;
      if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA") return;
      if (e.key === "ArrowRight") goChapter(1);
      if (e.key === "ArrowLeft") goChapter(-1);
    });

    // ==== Chat ====
    async function sendChat(e) {
      e.preventDefault();
      if (!CURRENT_BOOK) return;
      const input = document.getElementById("chat-input");
      const provider = document.getElementById("chat-provider").value;
      const agentMode = document.getElementById("agent-mode-toggle").checked;
      const question = input.value.trim();
      if (!question) return;

      const ch = CURRENT_BOOK.chapters[CURRENT_CH];
      const chapterNum = ch.number || (CURRENT_CH + 1);

      addMessage("user", question);
      input.value = "";
      document.getElementById("chat-send").disabled = true;

      // For agent mode, show an animated plan strip while we wait
      let planEl = null;
      if (agentMode) {
        planEl = renderAgentRunning();
      }
      const thinkingEl = agentMode ? null : addMessage("bot", "Thinking…");

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            chapter: chapterNum,
            book_id: CURRENT_BOOK.id,
            provider,
            top_k: 4,
            agent_mode: agentMode,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        if (thinkingEl) thinkingEl.remove();
        if (planEl) planEl.remove();
        if (data.agent) {
          renderAgentPlan(data.agent);
        }
        renderBotAnswer(data);
      } catch (err) {
        if (planEl) planEl.remove();
        if (thinkingEl) thinkingEl.textContent = "Error: " + err.message;
        else addMessage("bot", "Error: " + err.message);
      } finally {
        document.getElementById("chat-send").disabled = false;
      }
    }

    function renderAgentRunning() {
      const list = document.getElementById("chat-messages");
      const el = document.createElement("div");
      el.className = "agent-plan";
      el.innerHTML = `
        <div class="head">🤖 Agent (Planner → Executor → Synthesizer → Critic)</div>
        <div class="agent-step running"><span class="icon">⟳</span><span class="label">Planning approach…</span></div>
        <div class="agent-step"><span class="icon">·</span><span class="label">Executor</span><span class="meta">queued</span></div>
        <div class="agent-step"><span class="icon">·</span><span class="label">Synthesizer</span><span class="meta">queued</span></div>
        <div class="agent-step"><span class="icon">·</span><span class="label">Critic verifying</span><span class="meta">queued</span></div>
      `;
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
      return el;
    }

    function renderAgentPlan(agent) {
      const list = document.getElementById("chat-messages");
      const el = document.createElement("div");
      el.className = "agent-plan";
      const t = agent.timings || {};
      const totalMs = (t.planner_ms || 0) + (t.executor_ms || 0) + (t.synthesizer_ms || 0) + (t.critic_ms || 0) + (t.synthesizer_retry_ms || 0);

      const reason = (agent.plan && agent.plan.reasoning) ? agent.plan.reasoning : "";
      const tcLines = (agent.tool_calls || []).map(tc => `
        <div class="agent-step done">
          <span class="icon">✓</span>
          <span class="label"><code>${escapeHtml(tc.tool || '?')}(${escapeHtml(JSON.stringify(stripCtx(tc.args)).slice(1,-1))})</code></span>
          <span class="meta">${tc.n_results ?? '?'} results · ${tc.latency_ms ?? '?'}ms</span>
        </div>
      `).join("");

      const verdict = (agent.critic && agent.critic.verdict) || "?";
      const verdictClass = verdict.toUpperCase() === "PASS" ? "verdict-pass" : "verdict-fail";
      const issues = (agent.critic && agent.critic.issues) ? agent.critic.issues.join("; ") : "";

      el.innerHTML = `
        <div class="head">🤖 Agent run · ${totalMs}ms total</div>
        <div class="agent-step done"><span class="icon">✓</span><span class="label">Plan: ${escapeHtml(reason)}</span><span class="meta">${t.planner_ms ?? '?'}ms</span></div>
        ${tcLines}
        <div class="agent-step done ${agent.retried ? 'retried' : ''}"><span class="icon">✓</span><span class="label">Synthesizer drafted answer</span><span class="meta">${t.synthesizer_ms ?? '?'}ms${agent.retried ? ' + ' + (t.synthesizer_retry_ms || 0) + 'ms retry' : ''}</span></div>
        <div class="agent-step done"><span class="icon">✓</span><span class="label">Critic verdict: <span class="${verdictClass}">${verdict}</span>${issues ? ' — ' + escapeHtml(issues) : ''}</span><span class="meta">${t.critic_ms ?? '?'}ms</span></div>
      `;
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
      return el;
    }

    function stripCtx(args) {
      const a = { ...(args || {}) };
      delete a.book_id; delete a.chapter_limit;
      return a;
    }

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "chat-msg " + role;
      el.textContent = text;
      const list = document.getElementById("chat-messages");
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
      return el;
    }

    function renderBotAnswer(data) {
      const el = document.createElement("div");
      el.className = "chat-msg bot";
      const answerText = data.answer ||
        `(dry-run — retrieval only. Switch provider to Anthropic or OpenAI for a generated answer.)`;
      const citations = (data.chunks || []).map((c, i) => `
        <div class="cit">
          <strong>[${i + 1}]</strong> chapter ${c.metadata.chapter} · score ${c.score.toFixed(3)}<br>
          ${escapeHtml((c.document || "").substring(0, 300))}${(c.document || "").length > 300 ? "…" : ""}
        </div>`).join("");
      el.innerHTML = escapeHtml(answerText) + (citations
        ? `<div class="citations"><details><summary>${data.chunks.length} cited passages</summary>${citations}</details></div>`
        : "");
      const list = document.getElementById("chat-messages");
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
    }

    // ==== Boot ====
    loadLibrary();
  </script>
</body>
</html>
